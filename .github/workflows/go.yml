name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Test & Coverage
      run: bash scripts/check_coverage.sh

    # check_coverage.sh skips tools/, so the parity-surface allowlist check (which fails when an
    # SDK bump adds API surface) and the tools' own tests run here.
    - name: Tools
      run: go test ./tools/...

    # server/requests.go is generated from the SDK's input shapes; after an SDK bump it must be
    # regenerated (go run ./tools/generate_requests), or the server silently drops new fields.
    - name: Generated requests are up to date
      run: |
        go run ./tools/generate_requests
        git diff --exit-code server/requests.go




